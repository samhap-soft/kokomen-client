# TLS 인증서 / 옵션
#
# 인증서는 기존 certbot이 호스트에 발급해둔 것을 그대로 쓴다(read-only 마운트).
# Traefik 자체 ACME로 넘어가는 건 별개의 변경이라 여기서는 건드리지 않는다.
#
# ★ 갱신 후 반영 주의
#   Traefik은 dynamic/ 디렉토리만 감시한다. /etc/letsencrypt 안의 pem 파일이
#   갱신돼도 감시 대상이 아니라서, 메모리에 올려둔 옛 인증서를 계속 쓴다.
#   certbot 갱신 훅으로 이 파일을 다시 써서(rename) 리로드를 유발해야 한다.
#   scripts/traefik-cert-reload-hook.sh 참고.
#
# cipherSuites는 지정하지 않는다. ATS records.yaml의 cipher_suite 목록은 OpenSSL
# 표기라 그대로 옮길 수 없고, Go/Traefik 기본값이 이미 그보다 좁고 안전하다.
#
# prod는 kokomen.kr 하나만 종료(terminate)한다.
# api.kokomen.kr / notification-api.kokomen.kr은 이 호스트가 아니라
# 별도 서버가 처리하므로 여기 인증서를 두지 않는다.

tls:
  options:
    default:
      minVersion: VersionTLS12

  certificates:
    - certFile: /etc/letsencrypt/live/kokomen.kr/fullchain.pem
      keyFile: /etc/letsencrypt/live/kokomen.kr/privkey.pem

  stores:
    default:
      # SNI가 어디에도 안 맞을 때 쓸 인증서.
      # ATS ssl_multicert.config에 kokomen.kr 하나만 있던 것과 같은 동작.
      defaultCertificate:
        certFile: /etc/letsencrypt/live/kokomen.kr/fullchain.pem
        keyFile: /etc/letsencrypt/live/kokomen.kr/privkey.pem
