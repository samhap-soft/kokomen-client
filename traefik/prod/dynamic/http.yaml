# :80 라우팅 — ACME 챌린지 통과 + 나머지는 HTTPS 리다이렉트
#
# entryPoints.web.http.redirections(전역 리다이렉트)를 쓰지 않는 이유:
# 그 방식은 예외를 둘 수 없어서 certbot의 HTTP-01 챌린지까지 리다이렉트해버린다.
# 그래서 라우터 두 개 + priority로 처리한다.
#
# 이건 ATS 대비 실제로 고쳐지는 부분이다.
# ATS remap.config은 `redirect http://kokomen.kr/ https://kokomen.kr/` 한 줄로
# HTTP 전체를 리다이렉트하고 있어서, HTTP-01 챌린지가 HTTPS로 넘어간 뒤
# Next.js에서 404가 된다(= webroot 방식 자동 갱신 불가).
# Traefik으로 넘어오면 무중단 갱신이 가능해지므로,
# 전환 후 `certbot renew --dry-run`으로 반드시 확인한다.

http:
  routers:
    # certbot webroot로 넘긴다. priority를 높여 리다이렉트보다 먼저 매칭.
    acme-challenge:
      rule: "PathPrefix(`/.well-known/acme-challenge/`)"
      entryPoints:
        - web
      service: certbot-webroot
      priority: 100

    http-to-https:
      rule: "Host(`kokomen.kr`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      # 미들웨어에서 리다이렉트로 끝나므로 여기까지 도달하지 않지만,
      # Traefik은 라우터에 service를 반드시 요구한다.
      service: certbot-webroot
      priority: 1

  services:
    certbot-webroot:
      loadBalancer:
        servers:
          - url: "http://kokomen-certbot-webroot:80"
