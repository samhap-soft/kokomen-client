# Traefik 정적 설정 (dev)
#
# 이 파일을 바꾸면 Traefik 재시작이 필요하다.
# 라우팅/백엔드/인증서처럼 배포 중에 바뀌는 것은 모두 dynamic/ 아래에서 관리한다.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

entryPoints:
  # TLS는 이 Traefik이 종단하지 않는다.
  # 호스트를 다른 스택과 공유하므로 80/443은 앞단의 nginx-proxy(+acme-companion)가 잡고,
  # Traefik은 Host 헤더를 그대로 넘겨받아 내부 라우팅(blue-green 전환)만 담당한다.
  # 그래서 web 하나만 두고 컨테이너 포트를 호스트에 publish하지 않는다.
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        # nginx의 keepalive_timeout 65 대응
        idleTimeout: 65s
        # readTimeout/writeTimeout은 의도적으로 두지 않는다.
        # 값을 주면 요청 "전체"에 대한 제한이 되어 PDF 업로드나
        # WebSocket(음성 면접) 같은 장시간 커넥션이 끊긴다.
        # nginx의 proxy_read_timeout(업스트림 응답 대기)과는 다른 개념이다.

  # 헬스체크 전용. compose에서 호스트로 publish하지 않으므로
  # 도커 네트워크 내부에서만 접근 가능하다.
  internal:
    address: ":8082"

providers:
  # 파일 하나가 아니라 "디렉토리"를 감시한다.
  # 배포 스크립트가 temp 파일 생성 후 rename으로 교체하기 때문에,
  # 파일 단위 bind mount로는 inode가 바뀌어 변경을 감지하지 못한다.
  # (ATS에서 remap.config을 docker cp로 밀어넣어야 했던 것과 같은 문제)
  file:
    directory: /etc/traefik/dynamic
    watch: true

ping:
  entryPoint: internal
