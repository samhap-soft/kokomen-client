# :80 라우팅 — ACME 챌린지 통과 + 나머지는 HTTPS 리다이렉트
#
# entryPoints.web.http.redirections(전역 리다이렉트)를 쓰지 않는 이유:
# 그 방식은 예외를 둘 수 없어서 certbot의 HTTP-01 챌린지까지 리다이렉트해버린다.
# (prod ATS의 remap.config가 지금 그 상태다 — 갱신 방식 점검 필요)
# 그래서 라우터 두 개 + priority로 처리한다.

http:
  routers:
    # certbot webroot로 넘긴다. priority를 높여 리다이렉트보다 먼저 매칭.
    acme-challenge:
      rule: "PathPrefix(`/.well-known/acme-challenge/`)"
      entryPoints:
        - web
      service: certbot-webroot
      priority: 100

    http-to-https:
      rule: "Host(`dev.kokomen.kr`) || Host(`api-dev.kokomen.kr`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      # 미들웨어에서 리다이렉트로 끝나므로 여기까지 도달하지 않지만,
      # Traefik은 라우터에 service를 반드시 요구한다.
      service: certbot-webroot
      priority: 1

  services:
    certbot-webroot:
      loadBalancer:
        servers:
          - url: "http://kokomen-certbot-webroot:80"
