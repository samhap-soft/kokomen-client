# dev.kokomen.kr 라우팅 (Blue-Green)
#
# ★ 배포 스크립트(scripts/blue-green-deploy-dev.sh)가 아래 "service:" 한 줄만 교체한다.
#   두 색이 항상 정의돼 있지만 라우터는 한쪽만 가리키므로,
#   비활성 색상 컨테이너를 미리 띄워도 트래픽이 가지 않는다.
#   전환은 이 한 줄이 바뀌는 순간 100% 단번에 일어난다(구/신 버전 섞임 없음).

http:
  routers:
    client:
      rule: "Host(`dev.kokomen.kr`)"
      entryPoints:
        - websecure
      service: client-blue
      middlewares:
        - security-headers
      tls: {}

  services:
    client-blue:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://kokomen-client-blue:3000"

    client-green:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://kokomen-client-green:3000"
