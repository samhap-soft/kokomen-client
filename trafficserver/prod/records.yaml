# ATS 9.x 이상 버전 기준 올바른 구조
records:
  http:
    server_ports: 80 443:ssl
    keep_alive_enabled_out: 1
    keep_alive_enabled_in: 1
    response_server_enabled: 0
    connect_attempts_timeout: 60
    transaction_no_activity_timeout_out: 60
    cache:
      http: 0
    # Via 헤더 설정 (경로 확인)
    insert_request_via_str: 0
    insert_response_via_str: 0

  reverse_proxy:
    enabled: 1

  url_remap:
    remap_required: 1
    pristine_host_hdr: 1

  ssl:
    client:
      verify:
        server:
          policy: PERMISSIVE
    server:
      cert:
        path: /etc/letsencrypt/live/kokomen.kr
      private_key:
        path: /etc/letsencrypt/live/kokomen.kr
      cipher_suite: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
