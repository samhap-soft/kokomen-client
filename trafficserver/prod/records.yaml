records:
  http:
    # 포트 설정 (기본 8080 -> 80/443)
    server_ports: "80 443:ssl"

    # Keep-alive
    keep_alive_enabled_out: 1
    keep_alive_enabled_in: 1

    # 서버 토큰 숨김
    response_server_enabled: 0

    # 타임아웃
    connect_attempts_timeout: 60
    transaction_no_activity_timeout_out: 60

    # 캐싱 비활성화 (리버스 프록시만 사용)
    cache:
      http: 0

    # Via 헤더 비활성화
    insert_request_via_str: 0
    insert_response_via_str: 0

  # 리버스 프록시 모드
  reverse_proxy:
    enabled: 1

  # URL 리맵 설정
  url_remap:
    remap_required: 1
    pristine_host_hdr: 1

  # SSL/TLS
  ssl:
    client:
      verify:
        server:
          policy: PERMISSIVE
          properties: ALL
