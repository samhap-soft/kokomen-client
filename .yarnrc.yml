approvedGitRepositories:
  - "**"

enableGlobalCache: false

enableScripts: true

nodeLinker: pnp

packageExtensions:
  "@nestjs/axios@*":
    dependencies:
      axios: "*"
  "@sentry/nextjs@*":
    peerDependencies:
      next: "*"
      react: "*"
      react-dom: "*"
    peerDependenciesMeta:
      react:
        optional: false
      react-dom:
        optional: false
  "@sentry/opentelemetry@*":
    dependencies:
      "@opentelemetry/api": ^1.0.0
      "@opentelemetry/core": ^1.0.0
      "@opentelemetry/sdk-trace-base": ^1.0.0
      "@opentelemetry/semantic-conventions": ^1.0.0
  "@sentry/react@*":
    peerDependencies:
      react: "*"
      react-dom: "*"
  "@tanstack/router-devtools-core@*":
    dependencies:
      "@tanstack/router-core": "*"
      tiny-invariant: "*"
  next@*:
    peerDependencies:
      "@next/bundle-analyzer": "*"
      "@sentry/nextjs": "*"
      pnp-webpack-plugin: "*"
  tsr@*:
    dependencies:
      typescript: "*"
  tunnel-rat@*:
    peerDependencies:
      react: "*"
      react-dom: "*"

yarnPath: .yarn/releases/yarn-4.14.1.cjs
