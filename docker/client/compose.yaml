# prod 클라이언트 스택.
#
# 이 호스트는 다른 스택과 공유하며 80/443은 앞단 nginx-proxy가 잡고 있다.
# 따라서 traefik은 호스트 포트를 publish하지 않고 내부 라우터로만 동작한다.
# nginx-proxy가 TLS를 종단하고 Host 헤더를 보존한 채 traefik:80으로 넘긴다.
#
# traefik이 두 provider를 함께 켜는 이유:
#   - file   : 클라이언트 blue-green (dynamic/client.yaml 의 "service:" 한 줄 교체)
#   - docker : API blue-green (backend 레포가 컨테이너 라벨로 선언, 떠 있는 색으로 결정)
# 각 레포가 자기 방식을 유지하므로 두 레포가 같은 파일을 만지지 않는다.

services:
  # Blue-Green 두 색. 포트를 publish하지 않고 expose만 하므로
  # 두 색이 동시에 떠 있어도 충돌하지 않는다.
  # 트래픽을 받는 쪽은 컨테이너 존재 여부가 아니라
  # traefik/prod/dynamic/client.yaml 의 "service:" 한 줄이 결정한다.
  client-blue:
    image: ${DOCKER_USERNAME}/kokomen-client-prod:production
    container_name: kokomen-client-blue-prod
    expose:
      - "3000"
    restart: always
    profiles:
      - blue
    networks:
      - prod-kokomen-net

  client-green:
    image: ${DOCKER_USERNAME}/kokomen-client-prod:production
    container_name: kokomen-client-green-prod
    expose:
      - "3000"
    restart: always
    profiles:
      - green
    networks:
      - prod-kokomen-net

  traefik:
    image: traefik:v3.3
    container_name: kokomen-traefik-prod
    expose:
      - "80"
    environment:
      # nginx-proxy(docker-gen)가 이 값을 보고 vhost를 생성한다.
      VIRTUAL_HOST: kokomen.kr,www.kokomen.kr,api.kokomen.kr
      VIRTUAL_PORT: "80"
      # acme-companion이 Let's Encrypt 인증서를 자동 발급·갱신한다.
      # 세 도메인이 한 장의 SAN 인증서로 묶인다.
      # 이전의 호스트 certbot + certbot-webroot 컨테이너를 대체한다.
      LETSENCRYPT_HOST: kokomen.kr,www.kokomen.kr,api.kokomen.kr
    volumes:
      # docker provider용. backend 레포가 붙인 API 컨테이너 라벨을 읽는다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 리포 워킹트리가 아니라 호스트의 별도 경로를 마운트한다.
      # actions/checkout이 매 배포마다 추적 파일을 되돌리는데, 워킹트리를 그대로
      # 마운트하면 checkout 순간 라우팅 파일이 초기값(client-blue)으로 돌아가고
      # Traefik이 그걸 감지해 죽은 색으로 트래픽을 보낸다.
      # 배포 스크립트가 리포 -> 이 경로로 동기화한다.
      - ${TRAEFIK_CONFIG_DIR:-/opt/kokomen/traefik/prod}/traefik.yaml:/etc/traefik/traefik.yaml:ro
      # 파일이 아니라 디렉토리를 마운트한다.
      # 배포 시 temp 파일 -> rename으로 교체하므로 inode가 바뀌는데,
      # 파일 단위 마운트면 컨테이너가 변경을 보지 못한다.
      - ${TRAEFIK_CONFIG_DIR:-/opt/kokomen/traefik/prod}/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - prod-kokomen-net
      - proxy-network

networks:
  prod-kokomen-net:
    external: true
  # 앞단 nginx-proxy가 붙어 있는 네트워크.
  # docker-gen이 컨테이너를 발견하려면 같은 네트워크에 있어야 한다.
  # 실제 네트워크명이 그쪽 compose 프로젝트 prefix(app_)를 포함하므로 name:을 명시한다.
  proxy-network:
    external: true
    name: app_proxy-network
