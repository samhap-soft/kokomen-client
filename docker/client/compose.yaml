version: "3.8"

services:
  client-blue:
    image: ${DOCKER_USERNAME}/kokomen-client-prod:production
    container_name: kokomen-client-blue
    expose:
      - "3000"
    restart: always
    profiles:
      - blue
    networks:
      kokomen-net:
        # 고정 IP: 컨테이너 재생성 시에도 동일 IP 회수 -> ATS HostDB 캐시 stale 문제 방지
        ipv4_address: 172.30.0.10

  client-green:
    image: ${DOCKER_USERNAME}/kokomen-client-prod:production
    container_name: kokomen-client-green
    expose:
      - "3000"
    restart: always
    profiles:
      - green
    networks:
      kokomen-net:
        ipv4_address: 172.30.0.11

  ats:
    image: trafficserver/trafficserver
    container_name: kokomen-ats
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 커스텀 설정 파일만 개별 마운트 (ATS 기본 파일 유지)
      - ../../trafficserver/prod/records.yaml:/opt/etc/trafficserver/records.yaml:ro
      - ../../trafficserver/prod/remap.config:/opt/etc/trafficserver/remap.config
      - ../../trafficserver/prod/ssl_multicert.config:/opt/etc/trafficserver/ssl_multicert.config:ro
      - ../../trafficserver/prod/ip_allow.yaml:/opt/etc/trafficserver/ip_allow.yaml:ro
      - ../../trafficserver/prod/logging.yaml:/opt/etc/trafficserver/logging.yaml:ro
      - ../../trafficserver/prod/plugin.config:/opt/etc/trafficserver/plugin.config:ro
      - ../../trafficserver/prod/storage.config:/opt/etc/trafficserver/storage.config:ro
      - ../../trafficserver/prod/header_rewrite:/opt/etc/trafficserver/header_rewrite:ro
      # Let's Encrypt 인증서
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    restart: always
    networks:
      - kokomen-net

networks:
  kokomen-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
