services:
  # Blue-Green 두 색. 포트를 publish하지 않고 expose만 하므로
  # 두 색이 동시에 떠 있어도 충돌하지 않는다.
  # 트래픽을 받는 쪽은 컨테이너 존재 여부가 아니라
  # traefik/dev/dynamic/client.yaml 의 "service:" 한 줄이 결정한다.
  client-blue:
    image: ${DOCKER_USERNAME}/kokomen-client:development
    container_name: kokomen-client-blue
    expose:
      - "3000"
    restart: always
    profiles:
      - blue
    networks:
      - dev-kokomen-net

  client-green:
    image: ${DOCKER_USERNAME}/kokomen-client:development
    container_name: kokomen-client-green
    expose:
      - "3000"
    restart: always
    profiles:
      - green
    networks:
      - dev-kokomen-net

  traefik:
    image: traefik:v3.3
    container_name: kokomen-traefik
    # 호스트 포트를 publish하지 않는다.
    # 이 호스트는 다른 스택과 공유하며 80/443은 앞단 nginx-proxy가 잡고 있다.
    # nginx-proxy가 TLS를 종단하고 Host 헤더를 보존한 채 여기 :80으로 넘긴다.
    # Traefik은 내부 라우팅(blue-green 전환 + api 분기)만 담당한다.
    expose:
      - "80"
    environment:
      # nginx-proxy(docker-gen)가 이 값을 보고 vhost를 생성한다.
      # 두 도메인을 콤마로 넘기면 둘 다 이 컨테이너로 온다.
      VIRTUAL_HOST: dev.kokomen.kr,api-dev.kokomen.kr
      VIRTUAL_PORT: "80"
      # acme-companion이 Let's Encrypt 인증서를 자동 발급·갱신한다.
      # 이전의 호스트 certbot + certbot-webroot 컨테이너를 대체한다.
      LETSENCRYPT_HOST: dev.kokomen.kr,api-dev.kokomen.kr
    volumes:
      # 리포 워킹트리가 아니라 호스트의 별도 경로를 마운트한다.
      # actions/checkout이 매 배포마다 추적 파일을 되돌리는데, 워킹트리를 그대로
      # 마운트하면 checkout 순간 라우팅 파일이 초기값(client-blue)으로 돌아가고
      # Traefik이 그걸 감지해 죽은 색으로 트래픽을 보낸다.
      # 배포 스크립트가 리포 -> 이 경로로 동기화한다.
      - ${TRAEFIK_CONFIG_DIR:-/opt/kokomen/traefik/dev}/traefik.yaml:/etc/traefik/traefik.yaml:ro
      # 파일이 아니라 디렉토리를 마운트한다.
      # 배포 시 temp 파일 -> rename으로 교체하므로 inode가 바뀌는데,
      # 파일 단위 마운트면 컨테이너가 변경을 보지 못한다.
      - ${TRAEFIK_CONFIG_DIR:-/opt/kokomen/traefik/dev}/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - dev-kokomen-net
      - proxy-network

networks:
  dev-kokomen-net:
    external: true
  # 앞단 nginx-proxy가 붙어 있는 네트워크.
  # docker-gen이 컨테이너를 발견하려면 같은 네트워크에 있어야 한다.
  # 실제 네트워크명이 그쪽 compose 프로젝트 prefix(app_)를 포함하므로 name:을 명시한다.
  proxy-network:
    external: true
    name: app_proxy-network
