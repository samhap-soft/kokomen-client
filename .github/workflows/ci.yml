name: "CI"

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Install dependencies"
        run: |
          corepack enable
          yarn install --immutable

      - name: "Run linters"
        run: |
          yarn lint
